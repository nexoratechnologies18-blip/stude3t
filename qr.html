<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B5D42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>رمز QR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head"><div><h1 data-i18n="qr_title">نظام رمز QR للحضور</h1></div></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="generate" data-i18n="generate_qr">إنشاء رموز QR</button>
        <button class="tab-btn" data-tab="scan" data-i18n="scan_qr">مسح رمز QR</button>
      </div>

      <div class="tab-panel active" id="tab-generate">
        <div class="filters-bar">
          <div class="field"><label data-i18n="grade">الصف</label><select id="genClass"></select></div>
          <div class="field"><label data-i18n="section">الشعبة</label><select id="genSection"></select></div>
          <div class="field" style="align-self:flex-end"><button class="btn btn-outline no-print" onclick="window.print()" data-i18n="print">طباعة</button></div>
        </div>
        <div class="qr-grid" id="qrGrid"></div>
      </div>

      <div class="tab-panel" id="tab-scan">
        <div class="grid grid-2">
          <div class="card">
            <h3 data-i18n="scan_qr">مسح رمز QR</h3>
            <video id="qrVideo" style="width:100%;border-radius:12px;background:#000" muted playsinline></video>
            <canvas id="qrCanvas" style="display:none"></canvas>
            <div style="margin-top:.7rem;display:flex;gap:.5rem">
              <button class="btn btn-primary" id="startCamBtn" data-i18n="scan_qr">مسح رمز QR</button>
              <button class="btn btn-outline" id="stopCamBtn" style="display:none" data-i18n="close">إيقاف</button>
            </div>
            <p class="text-dim" id="camStatus" style="margin-top:.6rem"></p>
          </div>
          <div class="card">
            <h3 data-i18n="manual_entry">إدخال يدوي</h3>
            <div class="field">
              <label data-i18n="enter_student_id">أدخل رقم الطالب</label>
              <input type="text" id="manualIdInput">
            </div>
            <button class="btn btn-accent" id="manualSubmitBtn" data-i18n="scan_qr">تسجيل</button>
            <div id="scanResultBox" style="margin-top:1rem"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/qr.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
