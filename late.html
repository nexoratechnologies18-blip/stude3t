<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B5D42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>التأخير</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head"><div><h1 data-i18n="nav_late">التأخير</h1><p class="sub text-dim" data-i18n="morning_lateness_sub" style="max-width:640px"></p></div></div>

      <div class="grid grid-2">
        <div class="card">
          <h3 data-i18n="late_settings">إعدادات التأخير</h3>
          <div class="form-row">
            <div class="field">
              <label data-i18n="school_start_time">وقت بداية الدوام</label>
              <input type="time" id="lsStart">
            </div>
            <div class="field">
              <label data-i18n="late_simple">تأخير بسيط (حتى دقيقة)</label>
              <input type="number" id="lsSimple" min="1">
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label data-i18n="late_medium">تأخير متوسط (حتى دقيقة)</label>
              <input type="number" id="lsMedium" min="1">
            </div>
            <div class="field">
              <label data-i18n="chronic_late">حد التأخير المتكرر (عدد المرات)</label>
              <input type="number" id="lsRepeated" min="1">
            </div>
          </div>
          <button class="btn btn-primary" id="saveLateSettingsBtn" data-i18n="save_settings">حفظ الإعدادات</button>
        </div>

        <div class="card">
          <h3 data-i18n="top_late_students">الطلاب الأكثر تأخيراً</h3>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th data-i18n="student_name">الاسم</th>
                <th data-i18n="grade">الصف</th>
                <th data-i18n="minutes_late">مرات التأخير</th>
                <th data-i18n="status">التصنيف</th>
              </tr></thead>
              <tbody id="topLateBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/late.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
