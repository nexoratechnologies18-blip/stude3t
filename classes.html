<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B5D42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>الصفوف والشعب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div><h1 data-i18n="manage_classes">إدارة الصفوف والشعب</h1></div>
        <div class="actions">
          <button class="btn btn-primary" id="addClassBtn" data-i18n="add_class">إضافة صف</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.2rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;flex-wrap:wrap;gap:.5rem">
          <h3 style="margin:0" data-i18n="manage_periods">إدارة الحصص الدراسية</h3>
          <button class="btn btn-outline btn-sm" id="addPeriodBtn" data-i18n="add_period">إضافة حصة</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="period">الحصة</th>
              <th data-i18n="period_name">اسم الحصة</th>
              <th data-i18n="period_start_time">بداية الحصة</th>
              <th data-i18n="period_end_time">نهاية الحصة</th>
              <th data-i18n="actions">إجراءات</th>
            </tr></thead>
            <tbody id="periodsBody"></tbody>
          </table>
        </div>
      </div>

      <div id="classesWrap" class="grid grid-2"></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="classModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><h3 data-i18n="add_class">إضافة صف</h3><button class="modal-close" onclick="closeModal('classModal')">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label data-i18n="class_name">اسم الصف</label><input type="text" id="classNameInput"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-i18n="cancel" onclick="closeModal('classModal')">إلغاء</button>
      <button class="btn btn-primary" id="saveClassBtn" data-i18n="save">حفظ</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="sectionModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><h3 data-i18n="add_section">إضافة شعبة</h3><button class="modal-close" onclick="closeModal('sectionModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="sectionClassId">
      <div class="field"><label data-i18n="section_name">اسم الشعبة</label><input type="text" id="sectionNameInput"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-i18n="cancel" onclick="closeModal('sectionModal')">إلغاء</button>
      <button class="btn btn-primary" id="saveSectionBtn" data-i18n="save">حفظ</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="periodModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><h3 id="periodModalTitle" data-i18n="add_period">إضافة حصة</h3><button class="modal-close" onclick="closeModal('periodModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="periodId">
      <div class="field"><label data-i18n="period_name">اسم الحصة</label><input type="text" id="periodNameInput"></div>
      <div class="form-row">
        <div class="field"><label data-i18n="period_start_time">بداية الحصة</label><input type="time" id="periodStartInput"></div>
        <div class="field"><label data-i18n="period_end_time">نهاية الحصة</label><input type="time" id="periodEndInput"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-i18n="cancel" onclick="closeModal('periodModal')">إلغاء</button>
      <button class="btn btn-primary" id="savePeriodBtn" data-i18n="save">حفظ</button>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/classes.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
