<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B5D42">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>التحليلات</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div><h1 data-i18n="analytics_title">التحليلات</h1><p class="sub text-dim" id="periodSub"></p></div>
      </div>

      <div class="grid grid-stats" id="analyticsStats"></div>

      <div class="grid grid-2" style="margin-top:1rem">
        <div class="card">
          <h3 data-i18n="class_comparison">مقارنة الحضور بين الصفوف</h3>
          <canvas id="classCompareChart" height="220"></canvas>
        </div>
        <div class="card">
          <h3 data-i18n="best_attendance_class">أكثر الصفوف حضوراً / غياباً</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th data-i18n="grade">الصف</th><th data-i18n="attendance_rate">نسبة الحضور</th></tr></thead>
              <tbody id="classRankBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="grid grid-2" style="margin-top:1rem">
        <div class="card">
          <h3 data-i18n="chronic_absentees">الطلاب أصحاب الغياب المتكرر</h3>
          <div class="table-wrap"><table>
            <thead><tr><th data-i18n="student_name">الاسم</th><th data-i18n="grade">الصف</th><th data-i18n="absent">مرات الغياب</th></tr></thead>
            <tbody id="chronicAbsentBody"></tbody>
          </table></div>
        </div>
        <div class="card">
          <h3 data-i18n="chronic_late">الطلاب أصحاب التأخير المتكرر</h3>
          <div class="table-wrap"><table>
            <thead><tr><th data-i18n="student_name">الاسم</th><th data-i18n="grade">الصف</th><th data-i18n="late">مرات التأخير</th></tr></thead>
            <tbody id="chronicLateBody"></tbody>
          </table></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/exceptions.js"></script>
<script src="js/analytics.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
